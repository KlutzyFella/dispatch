services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: dispatch-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      # Keep the log on a named volume; the image default (/tmp) is lost when
      # the container is recreated. A fixed cluster ID matches the stored data.
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - CLUSTER_ID=kaAVWN7yRs2AUC_u0BEg0w
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # A protocol round trip, not just an open port. Each check starts a JVM
      # (about 1.6 s of CPU), so probe every second only while starting, then
      # every 30 s: at a 2 s interval the check alone used ~0.85 of a core.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      start_period: 120s
      start_interval: 1s
      interval: 30s
      timeout: 15s
      retries: 3
  redis:
    image: redis:7.2
    container_name: dispatch-redis
    # Task state, attempt budgets and publication intents live only in Redis.
    # AOF with fsync every second survives restarts and recreation; a host
    # crash or power loss can still lose up to about one second of writes.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 3s
      retries: 3

  # Optional monitoring. Pinned by tag and digest; scrapes the host-run
  # dispatch (:9090) and worker-1 (:9091) started by `make up`.
  prometheus:
    image: prom/prometheus:v3.10.0@sha256:4a61322ac1103a0e3aea2a61ef1718422a48fa046441f299d71e660a3bc71ae9
    container_name: dispatch-prometheus
    ports:
      - "9093:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.4.1@sha256:e932bd6ed0e026595b08483cd0141e5103e1ab7ff8604839ff899b8dc54cabcb
    container_name: dispatch-grafana
    ports:
      - "3000:3000"
    environment:
      # Local demo credentials only.
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus

volumes:
  kafka-data:
  redis-data:
