apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch-worker
  labels:
    app: dispatch-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dispatch-worker
  template:
    metadata:
      labels:
        app: dispatch-worker
    spec:
      containers:
        - name: dispatch-worker
          image: dispatch-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9091
          env:
            - name: REDIS_ADDR
              value: "redis.default.svc.cluster.local:6379"
            - name: KAFKA_BROKER
              value: "kafka.default.svc.cluster.local:9092"
            - name: GRPC_SERVER_ADDR
              value: "dispatch-server.default.svc.cluster.local:50051"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
